<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swemessage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Roboto', Arial, sans-serif !important; }
        body { background-color: #0f172a; background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop'); background-size: cover; background-position: center; background-attachment: fixed; color: #e0e0e0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #auth-screen { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; border: 1px solid rgba(255,255,255,0.1); }
        h1 { text-align: center; margin-bottom: 20px; color: #bb86fc; font-weight: 500; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #2c2c2c; border: 1px solid #3c3c3c; border-radius: 6px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #bb86fc; }
        button { width: 100%; padding: 12px; background: #bb86fc; color: #000; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; margin-bottom: 10px; font-size: 15px; transition: 0.2s; }
        button:hover:not(:disabled) { background: #9965f4; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #3c3c3c; color: #e0e0e0; }
        .btn-secondary:hover:not(:disabled) { background: #4c4c4c; }
        #error-msg { color: #cf6679; text-align: center; font-size: 14px; margin-top: 10px; min-height: 20px; font-weight: 500; }
        
        #chat-screen { display: none; width: 100%; height: 100vh; max-width: 1200px; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); }
        #sidebar { width: 320px; background: rgba(37, 37, 37, 0.9); border-right: 1px solid #333; display: flex; flex-direction: column; }
        #sidebar-header { padding: 15px; border-bottom: 1px solid #333; }
        #my-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        #avatar { width: 40px; height: 40px; border-radius: 50%; background: #bb86fc; color: black; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; }
        #my-id-text { font-size: 12px; color: #888; cursor: pointer; }
        #search-input { width: 100%; padding: 10px 15px; background: #333; border: none; border-radius: 20px; color: white; font-size: 13px; outline: none; }
        #user-list { flex-grow: 1; overflow-y: auto; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
        .user-item:hover { background: #2c2c2c; }
        .user-item.active { background: #333; border-left: 3px solid #bb86fc; }
        .user-info { flex-grow: 1; }
        .user-name { font-weight: 500; font-size: 14px; }
        .user-status { font-size: 11px; color: #4CAF50; }
        .user-status.offline { color: #888; }
        
        #main-chat { flex-grow: 1; display: flex; flex-direction: column; background: rgba(26, 26, 26, 0.8); position: relative; }
        #chat-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 30, 30, 0.9); }
        #current-chat-name { font-weight: 500; font-size: 16px; }
        
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg.my { align-self: flex-end; background: #bb86fc; color: #000; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #2c2c2c; color: #e0e0e0; border-bottom-left-radius: 2px; }
        .msg-name { font-size: 11px; opacity: 0.7; margin-bottom: 2px; display: block; font-weight: 500; }

        #input-area { padding: 15px; background: rgba(30, 30, 30, 0.9); display: flex; gap: 10px; border-top: 1px solid #333; align-items: center; }
        #msg-input { flex-grow: 1; padding: 12px 15px; background: #2c2c2c; border: 1px solid #3c3c3c; border-radius: 20px; color: white; outline: none; }
        #msg-input:focus { border-color: #bb86fc; }
        #send-btn { width: auto; padding: 0 25px; border-radius: 20px; background: #bb86fc; color: #000; font-weight: bold; margin-bottom: 0; }
        #call-btn { width: 45px; height: 45px; border-radius: 50%; padding: 0; font-size: 20px; background: #4CAF50; color: white; margin-bottom: 0; display: flex; justify-content: center; align-items: center; }
        #call-btn.active { background: #f44336; }
        
        .empty-chat { display: flex; justify-content: center; align-items: center; height: 100%; color: #666; font-size: 16px; text-align: center; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h1>Swemessage</h1>
        <input type="text" id="regNickname" placeholder="Ваш Никнейм">
        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passwordInput" placeholder="Пароль (мин. 6 символов)">
        <button id="regBtn" onclick="registerUser()">Зарегистрироваться</button>
        <button id="loginBtn" class="btn-secondary" onclick="loginUser()">Войти</button>
        <p id="error-msg"></p>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div id="sidebar-header">
                <div id="my-profile">
                    <div id="avatar">?</div>
                    <div>
                        <div class="user-name" id="my-name-display">Загрузка...</div>
                        <div id="my-id-text" title="Нажмите, чтобы скопировать ID">ID: ...</div>
                    </div>
                </div>
                <input type="text" id="search-input" placeholder="Поиск по ID или нику...">
            </div>
            <div id="user-list"></div>
            <div style="padding: 15px; border-top: 1px solid #333;">
                <button class="btn-secondary" onclick="logout()" style="margin-bottom:0;">Выйти</button>
            </div>
        </div>

        <div id="main-chat">
            <div id="chat-header" style="display: none;">
                <span id="current-chat-name">Выберите чат</span>
            </div>
            <div id="chat-box">
                <div class="empty-chat">Выберите контакт слева, чтобы начать общение</div>
            </div>
            <div id="input-area" style="display: none;">
                <button id="call-btn">📞</button>
                <input type="text" id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwtSgIwcl3WQckITAoovh-U6sqa7bNzT4",
            authDomain: "swemessage-365d6.firebaseapp.com",
            projectId: "swemessage-365d6",
            storageBucket: "swemessage-365d6.firebasestorage.app",
            messagingSenderId: "587168011310",
            appId: "1:587168011310:web:2c2f20eaaf6697417bbbbf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentChatId = null;
        let unsubscribeMessages = null;
        let allUsersCache = [];
        let myUserData = null;

        // Переменные для звонка
        let pc = null;
        let localStream = null;
        let unsubscribeCalls = null;
        let currentAudio = null;
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        };

        function generateId() {
            return 'id_' + Math.random().toString(36).substr(2, 6);
        }

        // ===== РЕГИСТРАЦИЯ С ПОНЯТНЫМИ ОШИБКАМИ =====
        window.registerUser = async () => {
            const nick = document.getElementById('regNickname').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('regBtn');

            errorMsg.innerText = "";

            if (!nick || !email || !pass) {
                errorMsg.innerText = "⚠️ Заполни все поля!";
                return;
            }

            if (pass.length < 6) {
                errorMsg.innerText = "⚠️ Пароль должен быть минимум 6 символов!";
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                errorMsg.innerText = "⚠️ Неправильный email!";
                return;
            }

            btn.innerText = "⏳ Регистрация...";
            btn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const generatedId = generateId();
                await setDoc(doc(db, "users", userCredential.user.uid), { 
                    email: email, 
                    displayId: nick, 
                    publicId: generatedId, 
                    createdAt: serverTimestamp(), 
                    online: true
                });
            } catch (e) {
                console.error("Ошибка регистрации:", e);
                let errMsg = "Ошибка: " + e.message;
                switch(e.code) {
                    case 'auth/email-already-in-use':
                        errMsg = "❌ Этот email уже зарегистрирован!";
                        break;
                    case 'auth/invalid-email':
                        errMsg = "❌ Неправильный email!";
                        break;
                    case 'auth/weak-password':
                        errMsg = "❌ Слабый пароль (минимум 6 символов)!";
                        break;
                    case 'auth/network-request-failed':
                        errMsg = "❌ Проблема с интернетом!";
                        break;
                    case 'permission-denied':
                        errMsg = "❌ Нет доступа! Проверь правила Firestore.";
                        break;
                }
                errorMsg.innerText = errMsg;
            } finally {
                btn.innerText = "Зарегистрироваться";
                btn.disabled = false;
            }
        };

        // ===== ВХОД =====
        window.loginUser = async () => {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');

            errorMsg.innerText = "";

            if (!email || !pass) {
                errorMsg.innerText = "⚠️ Заполни email и пароль!";
                return;
            }

            btn.innerText = "⏳ Вход...";
            btn.disabled = true;

            try { 
                await signInWithEmailAndPassword(auth, email, pass); 
            } catch (e) { 
                let errMsg = "Ошибка: " + e.message;
                switch(e.code) {
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        errMsg = "❌ Неверный email или пароль!";
                        break;
                    case 'auth/invalid-email':
                        errMsg = "❌ Неправильный email!";
                        break;
                    case 'auth/too-many-requests':
                        errMsg = "❌ Слишком много попыток. Подожди минутку.";
                        break;
                    case 'auth/network-request-failed':
                        errMsg = "❌ Проблема с интернетом!";
                        break;
                }
                errorMsg.innerText = errMsg;
            } finally {
                btn.innerText = "Войти";
                btn.disabled = false;
            }
        };

        // ===== ВЫХОД =====
        window.logout = async () => {
            if (auth.currentUser) {
                await updateDoc(doc(db, "users", auth.currentUser.uid), { online: false }).catch(()=>{});
            }
            endCall();
            signOut(auth);
        };

        // ===== СЛЕДИМ ЗА АВТОРИЗАЦИЕЙ =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    myUserData = userDoc.data();
                    document.getElementById('my-name-display').innerText = myUserData.displayId;
                    document.getElementById('my-id-text').innerText = "ID: " + myUserData.publicId;
                    document.getElementById('avatar').innerText = myUserData.displayId.charAt(0).toUpperCase();
                    document.getElementById('my-id-text').onclick = () => { 
                        navigator.clipboard.writeText(myUserData.publicId); 
                        alert("ID скопирован: " + myUserData.publicId); 
                    };
                    await updateDoc(doc(db, "users", user.uid), { online: true }).catch(()=>{});
                } else {
                    const defaultNick = user.email.split('@')[0];
                    const generatedId = generateId();
                    await setDoc(doc(db, "users", user.uid), { 
                        email: user.email, 
                        displayId: defaultNick, 
                        publicId: generatedId, 
                        createdAt: serverTimestamp(), 
                        online: true 
                    });
                    myUserData = { displayId: defaultNick, publicId: generatedId };
                    document.getElementById('my-name-display').innerText = defaultNick;
                    document.getElementById('my-id-text').innerText = "ID: " + generatedId;
                    document.getElementById('avatar').innerText = defaultNick.charAt(0).toUpperCase();
                }
                loadUsers();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('chat-screen').style.display = 'none';
                if (unsubscribeMessages) unsubscribeMessages();
                if (unsubscribeCalls) unsubscribeCalls();
                endCall();
            }
        });

        async function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                allUsersCache = [];
                snapshot.forEach((doc) => {
                    if (doc.id !== auth.currentUser.uid) {
                        allUsersCache.push({ id: doc.id, ...doc.data() });
                    }
                });
                renderUsers(allUsersCache);
            });
        }

        function renderUsers(users) {
            const userList = document.getElementById('user-list');
            userList.innerHTML = "";
            if (users.length === 0) { 
                userList.innerHTML = '<div style="padding:15px;color:#888;text-align:center;">Никого не найдено</div>'; 
                return; 
            }
            users.forEach((user) => {
                const div = document.createElement('div');
                div.className = 'user-item';
                const statusClass = user.online ? 'user-status' : 'user-status offline';
                const statusText = user.online ? 'В сети' : 'Не в сети';
                const initial = user.displayId ? user.displayId.charAt(0).toUpperCase() : '?';
                div.innerHTML = `
                    <div style="width:32px;height:32px;border-radius:50%;background:#333;color:white;display:flex;justify-content:center;align-items:center;font-weight:bold;">${initial}</div>
                    <div class="user-info">
                        <div class="user-name">${user.displayId || 'Без имени'}</div>
                        <div class="${statusClass}">${statusText} • ${user.publicId || ''}</div>
                    </div>`;
                div.onclick = () => startChat(user.displayId, user.id, div);
                userList.appendChild(div);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allUsersCache.filter(u => 
                (u.displayId && u.displayId.toLowerCase().includes(term)) || 
                (u.publicId && u.publicId.toLowerCase().includes(term))
            );
            renderUsers(filtered);
        });

        function startChat(otherUserNick, otherUserUid, btnElement) {
            document.querySelectorAll('.user-item').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            currentChatId = [auth.currentUser.uid, otherUserUid].sort().join('_');
            document.getElementById('current-chat-name').innerText = otherUserNick;
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            loadMessages();
            setupCallListener();
        }

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "Загрузка...";
            const messagesRef = collection(db, "chats", currentChatId, "messages");
            const q = query(messagesRef, orderBy("createdAt", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = "";
                if (snapshot.empty) chatBox.innerHTML = '<div class="empty-chat">Напишите первое сообщение!</div>';
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderId === auth.currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'my' : 'other'}`;
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'msg-name';
                    nameSpan.textContent = isMe ? 'Вы' : msg.senderName;
                    div.appendChild(nameSpa
