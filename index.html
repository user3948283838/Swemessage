<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swemessage</title>

  <!-- 1. Подключаем шрифты Google (Google Sans + Manrope для идеальной кириллицы) -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnfonts.com" rel="stylesheet">

  <!-- 2. Принудительно применяем шрифт ко всем элементам, исключая Roboto -->
  <style>
    *, *::before, *::after, body, input, button, textarea, select {
      font-family: 'Product Sans', 'Google Sans', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif !important;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #1f1f1f;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Простой базовый дизайн для примера */
    .auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      padding: 20px;
    }

    button {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background-color: #1a73e8;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background-color: #e8eaed;
      color: #1f1f1f;
    }

    input {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #dadce0;
      font-size: 15px;
      outline: none;
    }

    .app-container {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 300px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .message-input-box {
      display: flex;
      gap: 8px;
    }

    .message-input-box input {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Модальное окно создания группы (по умолчанию скрыто) -->
  <div id="create-group-modal" style="display: none; padding: 20px; background: white; border-bottom: 1px solid #ccc;">
    <h3>Создать группу</h3>
    <input type="text" id="group-name-input" placeholder="Название группы">
    <button id="confirm-group-btn">Создать</button>
    <button class="secondary" id="cancel-group-btn">Отмена</button>
  </div>

  <!-- Экран авторизации -->
  <div id="auth-container" class="auth-screen">
    <h1>Swemessage</h1>
    <button id="register-btn">Зарегистрироваться</button>
    <button id="email-login-btn" class="secondary">Войти по Email</button>
    <button id="lolka-login-btn" style="background-color: #5865F2;">Войти через Lolka</button>
  </div>

  <!-- Основной интерфейс мессенджера (пока скрыт до входа, убери display: none если тестируешь) -->
  <div id="main-app" class="app-container" style="display: none;">
    <div class="sidebar">
      <div>
        <strong id="user-name">Загрузка...</strong>
        <div style="font-size: 12px; color: gray;">ID: <span id="user-id">...</span></div>
      </div>

      <div style="display: flex; gap: 6px;">
        <button id="new-group-btn" style="flex: 1;">+ Группа</button>
        <button id="favorites-btn" class="secondary">📝 Избранное</button>
      </div>

      <div id="chats-list" style="flex: 1; overflow-y: auto;">
        <!-- Сюда JS будет добавлять контакты -->
      </div>

      <button id="logout-btn" class="secondary">Выйти</button>
    </div>

    <div class="chat-area">
      <div id="chat-header">
        <strong>Выберите чат</strong>
      </div>

      <div id="messages-box" style="flex: 1; display: flex; align-items: center; justify-content: center; color: gray;">
        Выберите контакт слева, чтобы начать общение
      </div>

      <div class="message-input-box">
        <input type="text" id="message-input" placeholder="Написать сообщение...">
        <button id="send-btn">➤</button>
      </div>
    </div>
  </div>

  <!-- Сюда подключай свой JavaScript -->
  <script>
    // Твой код логики Swemessage
  </script>

</body>
</html>
