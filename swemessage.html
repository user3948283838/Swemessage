<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swemesagge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #121212; color: #e0e0e0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #auth-screen { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; }
        h1 { text-align: center; margin-bottom: 20px; color: #bb86fc; font-weight: 600; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #2c2c2c; border: 1px solid #3c3c3c; border-radius: 6px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #bb86fc; }
        button { width: 100%; padding: 12px; background: #bb86fc; color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        button:hover { background: #9965f4; }
        .btn-secondary { background: #3c3c3c; color: #e0e0e0; }
        .btn-secondary:hover { background: #4c4c4c; }
        .btn-lolka { background: #ff5722; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-lolka:hover { background: #e64a19; }
        #error-msg { color: #cf6679; text-align: center; font-size: 14px; margin-top: 10px; min-height: 20px; font-weight: 600; }
        
        /* Стили чата */
        #chat-screen { display: none; width: 100%; height: 100vh; max-width: 1200px; background: #1e1e1e; }
        #sidebar { width: 320px; background: #252525; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #sidebar-header { padding: 15px; border-bottom: 1px solid #333; }
        #my-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        #avatar { width: 40px; height: 40px; border-radius: 50%; background: #bb86fc; color: black; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; }
        #my-id-text { font-size: 12px; color: #888; cursor: pointer; }
        .action-btns { display: flex; gap: 5px; margin-bottom: 10px; }
        .action-btns button { padding: 8px; font-size: 12px; margin-bottom: 0; background: #333; color: white; }
        #search-input { width: 100%; padding: 10px 15px; background: #333; border: none; border-radius: 20px; color: white; font-size: 13px; outline: none; }
        #user-list { flex-grow: 1; overflow-y: auto; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
        .user-item:hover { background: #2c2c2c; }
        .user-item.active { background: #333; border-left: 3px solid #bb86fc; }
        .user-info { flex-grow: 1; }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-status { font-size: 11px; color: #4CAF50; }
        .user-status.offline { color: #888; }
        #main-chat { flex-grow: 1; display: flex; flex-direction: column; background: #1a1a1a; position: relative; }
        #chat-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; }
        #current-chat-name { font-weight: 600; font-size: 16px; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg.my { align-self: flex-end; background: #bb86fc; color: #000; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #2c2c2c; color: #e0e0e0; border-bottom-left-radius: 2px; }
        .msg-name { font-size: 11px; opacity: 0.7; margin-bottom: 2px; display: block; }
        #input-area { padding: 15px; background: #1e1e1e; display: flex; gap: 10px; border-top: 1px solid #333; }
        #msg-input { flex-grow: 1; padding: 12px 15px; background: #2c2c2c; border: 1px solid #3c3c3c; border-radius: 20px; color: white; outline: none; }
        #send-btn { width: auto; padding: 0 25px; border-radius: 20px; background: #bb86fc; color: #000; font-weight: bold; margin-bottom: 0; }
        .empty-chat { display: flex; justify-content: center; align-items: center; height: 100%; color: #666; font-size: 16px; text-align: center; }
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        #modal-group { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        #modal-group h3 { margin-bottom: 15px; color: #bb86fc; }
        #group-name { margin-bottom: 15px; }
        .group-checkbox { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #333; }
        .group-checkbox input { width: auto; margin: 0; }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div id="modal-group">
            <h3>Создать группу</h3>
            <input type="text" id="group-name" placeholder="Название группы...">
            <div id="group-users-list" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;"></div>
            <button onclick="createGroup()">Создать</button>
            <button class="btn-secondary" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <div id="auth-screen">
        <h1>Swemesagge</h1>
        <input type="text" id="regNickname" placeholder="Ваш Никнейм">
        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passwordInput" placeholder="Пароль (мин. 6 символов)">
        
        <button onclick="registerUser()">Зарегистрироваться</button>
        <button class="btn-secondary" onclick="loginUser()">Войти по Email</button>
        
        <!-- Кнопка Lolka -->
        <button class="btn-lolka" onclick="loginWithLolka()">Войти через Lolka</button>
        
        <p id="error-msg"></p>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div id="sidebar-header">
                <div id="my-profile">
                    <div id="avatar">?</div>
                    <div>
                        <div class="user-name" id="my-name-display">Загрузка...</div>
                        <div id="my-id-text" title="Нажмите, чтобы скопировать ID">ID: ...</div>
                    </div>
                </div>
                <div class="action-btns">
                    <button onclick="openGroupModal()">+ Группа</button>
                    <button onclick="openSavedMessages()">📝 Избранное</button>
                </div>
                <input type="text" id="search-input" placeholder="Поиск по ID или нику...">
            </div>
            <div id="user-list"></div>
            <div style="padding: 15px; border-top: 1px solid #333;">
                <button class="btn-secondary" onclick="logout()" style="margin-bottom:0;">Выйти</button>
            </div>
        </div>

        <div id="main-chat">
            <div id="chat-header" style="display: none;">
                <span id="current-chat-name">Выберите чат</span>
            </div>
            <div id="chat-box">
                <div class="empty-chat">Выберите контакт слева, чтобы начать общение</div>
            </div>
            <div id="input-area" style="display: none;">
                <input type="text" id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDocs, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwtSgIwcl3WQckITAoovh-U6sqa7bNzT4",
            authDomain: "swemessage-365d6.firebaseapp.com",
            projectId: "swemessage-365d6",
            storageBucket: "swemessage-365d6.firebasestorage.app",
            messagingSenderId: "587168011310",
            appId: "1:587168011310:web:2c2f20eaaf6697417bbbbf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Твои данные из Lolka
        const LOLKA_CLIENT_ID = "970285472647168";
        const LOLKA_REDIRECT_URI = "https://swemesagge.netlify.app/"; 

        let currentChatId = null;
        let currentChatType = "private"; 
        let unsubscribeMessages = null;
        let allUsersCache = [];
        let myUserData = null;

        function generateId() {
            return 'id_' + Math.random().toString(36).substr(2, 6);
        }

        // --- ВХОД ЧЕРЕЗ LOLKA (ИМИТАЦИЯ) ---
        window.loginWithLolka = () => {
            // 1. Создаем ссылку на авторизацию в Lolka
            const lolkaAuthUrl = `https://lolka.app/oauth/authorize?client_id=${LOLKA_CLIENT_ID}&redirect_uri=${encodeURIComponent(LOLKA_REDIRECT_URI)}&response_type=code&scope=identify`;
            window.location.href = lolkaAuthUrl;
        };

        // Проверка, вернулся ли пользователь с кодом Lolka
        async function checkLolkaCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                window.history.replaceState({}, document.title, window.location.pathname);
                document.getElementById('error-msg').innerText = "Вход через Lolka...";

                // ИМИТАЦИЯ: Мы генерируем случайную почту и пароль для Firebase.
                // В реальности здесь должен быть запрос к серверу Lolka, но мы его пропускаем.
                const fakeEmail = `lolka_${code.substring(0, 10)}@test.com`;
                const fakePass = "lolka_" + code; // Случайный пароль

                try {
                    // Пытаемся войти (если такой аккаунт уже есть)
                    await signInWithEmailAndPassword(auth, fakeEmail, fakePass);
                } catch (e) {
                    // Если не вышло — регистрируем новый
                    try {
                        const cred = await createUserWithEmailAndPassword(auth, fakeEmail, fakePass);
                        await setDoc(doc(db, "users", cred.user.uid), {
                            email: fakeEmail,
                            displayId: "LolkaUser_" + Math.floor(Math.random() * 1000),
                            publicId: generateId(),
                            createdAt: serverTimestamp(),
                            online: true
                        });
                    } catch (err) {
                        document.getElementById('error-msg').innerText = "Ошибка входа через Lolka: " + err.message;
                    }
                }
            }
        }

        // Запускаем проверку
        checkLolkaCallback();

        // ... (Остальной код: регистрация, вход по Email, чат и т.д. оставляем как в предыдущем коде) ...
        
        window.registerUser = async () => {
            const nick = document.getElementById('regNickname').value.trim();
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('error-msg');
            if (!nick || !email || !pass) { errorMsg.innerText = "Заполните все поля!"; return; }
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", userCredential.user.uid), { 
                    email: email, displayId: nick, publicId: generateId(), createdAt: serverTimestamp(), online: true
                });
            } catch (e) { errorMsg.innerText = "Ошибка: " + e.message; }
        };

        window.loginUser = async () => {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (e) { document.getElementById('error-msg').innerText = "Ошибка: " + e.message; }
        };

        window.logout = async () => {
            if (auth.currentUser) await updateDoc(doc(db, "users", auth.currentUser.uid), { online: false });
            signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    myUserData = userDoc.data();
                    document.getElementById('my-name-display').innerText = myUserData.displayId;
                    document.getElementById('my-id-text').innerText = "ID: " + myUserData.publicId;
                    document.getElementById('avatar').innerText = myUserData.displayId.charAt(0).toUpperCase();
                    document.getElementById('my-id-text').onclick = () => { navigator.clipboard.writeText(myUserData.publicId); alert("ID скопирован"); };
                    await updateDoc(doc(db, "users", user.uid), { online: true }).catch(()=>{});
                } else {
                    const defaultNick = user.email.split('@')[0];
                    await setDoc(doc(db, "users", user.uid), { email: user.email, displayId: defaultNick, publicId: generateId(), createdAt: serverTimestamp(), online: true });
                    location.reload(); // Перезагружаем, чтобы подхватить новый профиль
                }
                loadUsers();
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('chat-screen').style.display = 'none';
                if (unsubscribeMessages) unsubscribeMessages();
            }
        });

        async function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                allUsersCache = [];
                snapshot.forEach((doc) => {
                    if (doc.id !== auth.currentUser.uid) allUsersCache.push({ id: doc.id, ...doc.data() });
                });
                renderUsers(allUsersCache);
            });
        }

        function renderUsers(users) {
            const userList = document.getElementById('user-list');
            userList.innerHTML = "";
            if (users.length === 0) { userList.innerHTML = '<div style="padding:15px;color:#888;text-align:center;">Никого не найдено</div>'; return; }
            users.forEach((user) => {
                const div = document.createElement('div');
                div.className = 'user-item';
                const statusClass = user.online ? 'user-status' : 'user-status offline';
                div.innerHTML = `
                    <div style="width:32px;height:32px;border-radius:50%;background:#333;color:white;display:flex;justify-content:center;align-items:center;font-weight:bold;">${user.displayId.charAt(0).toUpperCase()}</div>
                    <div class="user-info"><div class="user-name">${user.displayId}</div><div class="${statusClass}">${user.online ? 'В сети' : 'Не в сети'} • ${user.publicId}</div></div>`;
                div.onclick = () => startChat(user.displayId, user.id, div);
                userList.appendChild(div);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderUsers(allUsersCache.filter(u => u.displayId.toLowerCase().includes(term) || u.publicId.toLowerCase().includes(term)));
        });

        window.openSavedMessages = () => {
            currentChatType = "private";
            currentChatId = [auth.currentUser.uid, auth.currentUser.uid].sort().join('_');
            document.getElementById('current-chat-name').innerText = "📝 Избранное";
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            loadMessages();
        };

        window.openGroupModal = () => {
            const list = document.getElementById('group-users-list');
            list.innerHTML = "";
            allUsersCache.forEach(user => {
                const div = document.createElement('div');
                div.className = 'group-checkbox';
                div.innerHTML = `<input type="checkbox" value="${user.id}" id="check-${user.id}"> <label for="check-${user.id}" style="flex-grow:1;">${user.displayId}</label>`;
                list.appendChild(div);
            });
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        window.closeModal = () => { document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('group-name').value = ""; };

        window.createGroup = async () => {
            const groupName = document.getElementById('group-name').value.trim();
            if (!groupName) return alert("Введите название группы");
            const checkboxes = document.querySelectorAll('#group-users-list input[type="checkbox"]:checked');
            const members = [auth.currentUser.uid];
            checkboxes.forEach(cb => members.push(cb.value));
            if (members.length < 2) return alert("Выберите хотя бы одного участника");
            try {
                const groupRef = await addDoc(collection(db, "groups"), { name: groupName, members: members, createdAt: serverTimestamp() });
                closeModal();
                openGroupChat(groupRef.id, groupName);
            } catch (e) { alert("Ошибка: " + e.message); }
        };

        function openGroupChat(groupId, groupName) {
            currentChatType = "group";
            currentChatId = groupId;
            document.getElementById('current-chat-name').innerText = "👥 " + groupName;
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            loadMessages();
        }

        function startChat(otherUserNick, otherUserUid, btnElement) {
            document.querySelectorAll('.user-item').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            currentChatType = "private";
            currentChatId = [auth.currentUser.uid, otherUserUid].sort().join('_');
            document.getElementById('current-chat-name').innerText = otherUserNick;
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            loadMessages();
        }

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            const chatBox = document.getElementById('chat-box');
            ch
